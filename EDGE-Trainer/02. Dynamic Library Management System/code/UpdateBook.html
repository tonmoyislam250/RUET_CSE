<!-- UpdateBook.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Update Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="Dashboard.html">Library Admin Panel</a>
        </div>
    </nav>
    <div class="container mt-5">
        <h2>Update Book</h2>
        <form>
            <div class="mb-3">
                <label>Book ID:</label>
                <input type="text" class="form-control">
            </div>
            <div class="mb-3">
                <label>Title:</label>
                <input type="text" class="form-control">
            </div>
            <div class="mb-3">
                <label>Author:</label>
                <input type="text" class="form-control">
            </div>
            <div class="mb-3">
                <label>Price:</label>
                <input type="number" class="form-control">
            </div>
            <button class="btn btn-primary">Update Book</button>
        </form>
    </div>
</body>
</html>
